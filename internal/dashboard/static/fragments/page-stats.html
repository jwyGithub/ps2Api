<section class="page" id="page-stats">
    <div class="p-8">
      <div class="flex items-end justify-between mb-8 gap-6 flex-wrap">
        <div>
          <div class="text-[11px] font-semibold tracking-wider uppercase mb-2" style="color: var(--muted);">Analytics</div>
          <h1 class="hero-title">深度统计 <em>分析</em></h1>
          <p class="mt-2 text-[14px]" style="color: var(--fg-2);">多维度透视调用结构、账号效能与渠道质量。</p>
        </div>
        <div class="flex items-center gap-2">
          <select class="input select w-44" id="statsRange">
            <option value="7">最近 7 天</option>
            <option value="14" selected>最近 14 天</option>
            <option value="30">最近 30 天</option>
            <option value="month">本月</option>
          </select>
          <button class="btn btn-ghost" onclick="refreshData()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            刷新
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
        <div class="card p-5">
          <div class="text-[11px] uppercase tracking-wider" style="color: var(--muted);">总调用</div>
          <div class="font-display text-[28px] font-medium mt-2">1.83M</div>
          <div class="text-[11px] mt-1" style="color: var(--muted);">累计</div>
        </div>
        <div class="card p-5">
          <div class="text-[11px] uppercase tracking-wider" style="color: var(--muted);">Token 消耗</div>
          <div class="font-display text-[28px] font-medium mt-2">842M</div>
          <div class="text-[11px] mt-1" style="color: var(--muted);">累计</div>
        </div>
        <div class="card p-5">
          <div class="text-[11px] uppercase tracking-wider" style="color: var(--muted);">估算成本</div>
          <div class="font-display text-[28px] font-medium mt-2">$0.00</div>
          <div class="text-[11px] mt-1" style="color: var(--muted);" id="statCostNote">按模型单价估算</div>
        </div>
        <div class="card p-5">
          <div class="text-[11px] uppercase tracking-wider" style="color: var(--muted);">P95 延迟</div>
          <div class="font-display text-[28px] font-medium mt-2">-</div>
          <div class="text-[11px] mt-1" style="color: var(--muted);" id="statP95Note">来自真实请求日志</div>
        </div>
        <div class="card p-5">
          <div class="text-[11px] uppercase tracking-wider" style="color: var(--muted);">错误率</div>
          <div class="font-display text-[28px] font-medium mt-2">0.00%</div>
          <div class="text-[11px] mt-1" style="color: var(--muted);" id="statErrNote">实时</div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div class="card p-6">
          <h3 class="font-display text-[20px] font-medium mb-1">每小时调用量</h3>
          <p class="text-[12px] mb-4" style="color: var(--muted);">24 小时分布 · 高峰 14:00-17:00</p>
          <div class="h-64"><canvas id="chartHourly"></canvas></div>
        </div>
        <div class="card p-6">
          <h3 class="font-display text-[20px] font-medium mb-1">模型使用占比</h3>
          <p class="text-[12px] mb-4" style="color: var(--muted);">按调用次数聚合</p>
          <div class="h-64"><canvas id="chartModel"></canvas></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div class="card p-6 lg:col-span-2">
          <h3 class="font-display text-[20px] font-medium mb-1">渠道效能对比</h3>
          <p class="text-[12px] mb-4" style="color: var(--muted);">延迟、成功率、成本三维评估</p>
          <div class="h-72"><canvas id="chartRadar"></canvas></div>
        </div>
        <div class="card p-6">
          <h3 class="font-display text-[20px] font-medium mb-1">活跃热力</h3>
          <p class="text-[12px] mb-4" style="color: var(--muted);">7 天 × 24 小时</p>
          <div id="heatmap" class="space-y-1"></div>
          <div class="flex items-center justify-between mt-4 text-[10px]" style="color: var(--muted);">
            <span>少</span>
            <div class="flex gap-1">
              <div class="heat-cell"></div>
              <div class="heat-cell heat-1"></div>
              <div class="heat-cell heat-2"></div>
              <div class="heat-cell heat-3"></div>
              <div class="heat-cell heat-4"></div>
              <div class="heat-cell heat-5"></div>
            </div>
            <span>多</span>
          </div>
        </div>
      </div>

      <div class="card p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display text-[20px] font-medium">Top 账号效能</h3>
          <span class="text-[12px]" style="color: var(--muted);">按成功调用次数排序</span>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>排名</th><th>账号 ID</th><th>渠道</th><th>调用次数</th>
                <th>Token 消耗</th><th>平均延迟</th><th>成功率</th><th>效能分</th>
              </tr>
            </thead>
            <tbody id="topAccountsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
