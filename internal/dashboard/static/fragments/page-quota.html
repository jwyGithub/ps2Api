<section class="page" id="page-quota">
    <div class="p-8">
      <div class="flex items-end justify-between mb-8 gap-6 flex-wrap">
        <div>
          <div class="text-[11px] font-semibold tracking-wider uppercase mb-2" style="color: var(--muted);">Quota</div>
          <h1 class="hero-title">额度 <em>管理</em></h1>
          <p class="mt-2 text-[14px]" style="color: var(--fg-2);">Postman AI 额度周期、剩余量与短期限流窗口。</p>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-ghost" onclick="exportQuota()">导出额度</button>
          <button class="btn btn-primary" onclick="refreshQuota()">刷新额度</button>
        </div>
      </div>

      <div class="card p-8 mb-6 relative overflow-hidden grid-bg">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 relative">
          <div>
            <div class="text-[11px] uppercase tracking-wider mb-3" style="color: var(--muted);">账号池总额度</div>
            <div class="font-display text-[56px] font-medium leading-none gradient-text" id="quotaTotal">0</div>
            <div class="text-[13px] mt-2" style="color: var(--fg-2);">Postman AI 额度单位</div>
            <div class="mt-4 flex items-center gap-3">
              <span class="tag tag-amber" id="quotaNear">已用 0%</span>
              <span class="text-[12px]" style="color: var(--muted);" id="quotaReset">等待额度数据</span>
            </div>
          </div>
          <div class="lg:col-span-2">
            <div class="flex items-center justify-between mb-3">
              <span class="text-[12px] font-semibold">消耗进度</span>
              <span class="text-[12px] font-mono"><span class="font-semibold" id="quotaProgressText" style="color: var(--accent);">0</span> / <span id="quotaProgressTotal">0</span></span>
            </div>
            <div class="progress" style="height: 12px;">
              <div class="progress-fill" id="quotaProgressBar" style="width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--gold));"></div>
            </div>
            <div class="grid grid-cols-4 gap-4 mt-6">
              <div>
                <div class="text-[11px]" style="color: var(--muted);">已使用</div>
                <div class="font-display text-[24px] font-medium mt-1" id="quotaUsed">0</div>
              </div>
              <div>
                <div class="text-[11px]" style="color: var(--muted);">剩余</div>
                <div class="font-display text-[24px] font-medium mt-1" id="quotaRemaining" style="color: var(--success);">0</div>
              </div>
              <div>
                <div class="text-[11px]" style="color: var(--muted);">超额使用</div>
                <div class="font-display text-[24px] font-medium mt-1" id="quotaOverage">0</div>
              </div>
              <div>
                <div class="text-[11px]" style="color: var(--muted);">已采集账号</div>
                <div class="font-display text-[24px] font-medium mt-1" id="quotaTracked">0</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card p-6 mb-6">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div><div class="text-[11px]" style="color:var(--muted)">官方告警阈值</div><div class="font-mono font-semibold mt-1" id="quotaOfficialThresholds">-</div></div>
          <div><div class="text-[11px]" style="color:var(--muted)">超额策略</div><div class="font-mono font-semibold mt-1" id="quotaOveragePolicy">-</div></div>
          <div><div class="text-[11px]" style="color:var(--muted)">额度归属</div><div class="font-mono font-semibold mt-1" id="quotaPoolMode">-</div></div>
          <div><div class="text-[11px]" style="color:var(--muted)">请求频率</div><div class="font-mono font-semibold mt-1" id="quotaRateSummary">-</div></div>
        </div>
      </div>

      <div class="card overflow-hidden mb-6">
        <div class="p-6 flex items-end justify-between gap-4 flex-wrap">
          <div>
            <h3 class="font-display text-[18px] font-medium mb-1">账号额度周期</h3>
            <p class="text-[12px]" style="color: var(--muted);">每次对话或额度探测都会更新官方快照</p>
          </div>
          <span class="text-[12px] font-mono" style="color:var(--muted)" id="quotaSnapshotAt">-</span>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table" style="min-width:1120px">
            <thead><tr><th>账号</th><th>状态</th><th>额度消耗</th><th>剩余</th><th>周期</th><th>下次重置</th><th>超额 / 共享</th><th>请求限流</th></tr></thead>
            <tbody id="quotaAccountsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display text-[18px] font-medium">额度告警规则</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr><th>规则名</th><th>触发条件</th><th>通知方式</th><th>状态</th><th>最近触发</th><th>操作</th></tr>
            </thead>
            <tbody id="quotaRules"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
