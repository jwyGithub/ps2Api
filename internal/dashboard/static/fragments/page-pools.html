<section class="page" id="page-pools">
    <div class="p-8">
      <div class="flex items-end justify-between mb-8 gap-6 flex-wrap">
        <div>
          <div class="text-[11px] font-semibold tracking-wider uppercase mb-2" style="color: var(--muted);">Pool Management</div>
          <h1 class="hero-title">号池 & <em>额度</em></h1>
          <p class="mt-2 text-[14px]" style="color: var(--fg-2);">统一管理所有上游账号，监控健康度、配额与额度周期。</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-end">
          <input id="accountImportFile" type="file" accept="application/json,.json" multiple class="hidden" onchange="importAccountsFile(this)">
          <button class="btn btn-ghost" onclick="document.getElementById('accountImportFile').click()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
            导入
          </button>
          <button class="btn btn-ghost" onclick="exportAccounts()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            导出
          </button>
          <button class="btn btn-primary" onclick="openDrawer()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            添加账号
          </button>
        </div>
      </div>

      <div class="card p-4 mb-4 flex items-center gap-x-5 gap-y-3 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="dot dot-online"></span>
          <span class="text-[11px]" style="color: var(--muted);">在线</span>
          <span class="font-mono font-semibold text-[14px]" data-pool-count="active">0</span>
          <span class="text-[11px] font-mono" style="color: var(--muted);" data-pool-pct="active">0%</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="dot dot-idle"></span>
          <span class="text-[11px]" style="color: var(--muted);">额度耗尽</span>
          <span class="font-mono font-semibold text-[14px]" data-pool-count="exhausted">0</span>
          <span class="text-[11px] font-mono" style="color: var(--muted);" data-pool-pct="exhausted">0%</span>
          <button class="icon-btn" style="width:20px;height:20px" title="刷新额度耗尽账号的额度" onclick="refreshStatusQuota('exhausted')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <span class="dot dot-error"></span>
          <span class="text-[11px]" style="color: var(--muted);">异常</span>
          <span class="font-mono font-semibold text-[14px]" data-pool-count="error">0</span>
          <span class="text-[11px] font-mono" style="color: var(--muted);" data-pool-pct="error">0%</span>
          <button class="icon-btn" style="width:20px;height:20px" title="刷新异常账号的额度" onclick="refreshStatusQuota('error')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <span class="dot dot-offline"></span>
          <span class="text-[11px]" style="color: var(--muted);">离线</span>
          <span class="font-mono font-semibold text-[14px]" data-pool-count="offline">0</span>
          <span class="text-[11px] font-mono" style="color: var(--muted);" data-pool-pct="offline">0%</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="dot dot-offline"></span>
          <span class="text-[11px]" style="color: var(--muted);">已停用</span>
          <span class="font-mono font-semibold text-[14px]" data-pool-count="disabled">0</span>
          <span class="text-[11px] font-mono" style="color: var(--muted);" data-pool-pct="disabled">0%</span>
          <button class="icon-btn" style="width:20px;height:20px" title="刷新已停用账号的额度" onclick="refreshStatusQuota('disabled')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-end ml-auto">
          <input class="input" style="width: 220px;" placeholder="搜索账号邮箱、来源..." id="poolSearch">
          <select class="input select" style="width: 150px;" id="poolStatus">
            <option value="ALL">所有状态</option>
            <option value="active">在线</option>
            <option value="exhausted">额度耗尽</option>
            <option value="error">异常</option>
            <option value="offline">离线</option>
            <option value="disabled">停用</option>
          </select>
        </div>
      </div>

      <div id="poolsCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>

      <div class="card mt-4 flex items-center justify-between px-6 py-4">
        <div class="text-[12px]" style="color: var(--muted);" id="poolCount">共 0 条</div>
        <div class="flex items-center gap-1" id="poolPager"></div>
      </div>

    </div>
  </section>
