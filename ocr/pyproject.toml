[project]
name = "ps2api-ocr"
version = "0.1.0"
description = "精准 OCR 识别服务（RapidOCR + ONNXRuntime），为 ps2api 网关的图片识别提供外部 OCR 后端。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web 服务
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 精准 OCR 引擎：PaddleOCR PP-OCRv4/v5 模型 + ONNXRuntime，CPU 友好、无重系统依赖
    "rapidocr-onnxruntime>=1.4.4",
    # 图片解码 / http(s) 直链下载
    "pillow>=10.4.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# 纯应用（非可安装库）：不需要构建后端，直接用 `uv run` 运行。
[tool.uv]
package = false
