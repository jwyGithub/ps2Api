services:
  ps2api:
    build: .
    image: ps2api
    container_name: ps2api
    restart: unless-stopped
    ports:
      - "1930:1930"
    volumes:
      - ./data:/data
    # API Key 不再走环境变量：首次启动后在面板「系统设置 → 安全与认证」设置，存入 SQLite。
    environment:
      # - GATEWAY_PORT=1930
      - GATEWAY_TRACE_LOG=1
      - GATEWAY_TRACE_DIR=/data/traces
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1930/health"]
      interval: 30s
      timeout: 3s
      retries: 3
