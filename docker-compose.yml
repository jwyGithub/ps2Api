services:
  ps2api:
    build: .
    image: ps2api
    container_name: ps2api
    restart: unless-stopped
    ports:
      - "1930:1930"
    volumes:
      - ./data:/data
    # API Key 不再走环境变量：首次启动后在面板「系统设置 → 安全与认证」设置，存入 SQLite。
    environment:
      # - GATEWAY_PORT=1930
      - GATEWAY_TRACE_LOG=1
      - GATEWAY_TRACE_DIR=/data/traces
      # 复用服务器上已有的 redis:8-alpine（容器名 sub2api-redis，在 sub2api_sub2api-network 网络内）。
      # 用独立 DB 索引 /1 + 键前缀 ps2api，与 sub2api 隔离，避免键冲突。
      - REDIS_URL=redis://sub2api-redis:6379/1
      - REDIS_KEY_PREFIX=ps2api
      # - REDIS_CONV_TTL=72h      # 会话映射存活时长，0/off/none/never 表示永不过期
      # 内置 OCR 服务（RapidOCR + ONNXRuntime）已打进本镜像，容器内监听 127.0.0.1:8000。
      # 面板「系统设置 → 图片识别」把识别引擎选 ocr（或 ocr_then_vision）即开箱即用，
      # 无需再配置 OCR 服务地址。仅当要改端口/上限时才用下面这些变量。
      # - OCR_PORT=8000
      # - OCR_MAX_IMAGE_MB=20
      # - OCR_ALLOW_REMOTE_FETCH=true
    networks:
      - default
      - sub2api-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1930/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      # 首次启动需下载/预热已内置的 OCR 模型并起进程，给足冷启动时间。
      start_period: 40s

networks:
  # 项目自身的默认网络（保持 ps2api 原有的对外/对内连通性）
  default:
  # 复用已存在的外部网络，用于连到 sub2api-redis
  sub2api-net:
    external: true
    name: sub2api_sub2api-network
