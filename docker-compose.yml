services:
  ps2api:
    build: .
    image: ps2api
    container_name: ps2api
    restart: unless-stopped
    ports:
      - "1930:1930"
    volumes:
      - ./data:/data
    # API Key 不再走环境变量：首次启动后在面板「系统设置 → 安全与认证」设置，存入 SQLite。
    environment:
      # - GATEWAY_PORT=1930
      - GATEWAY_TRACE_LOG=1
      - GATEWAY_TRACE_DIR=/data/traces
      # 会话存储走 Redis（多实例共享 + TTL 回收）；不配置则回退进程内内存。
      - REDIS_URL=redis://redis:6379/0
      # - REDIS_CONV_TTL=72h      # 会话映射存活时长，0/off/none/never 表示永不过期
      # - REDIS_KEY_PREFIX=ps2api # 键前缀，多实例/多环境共用同一 Redis 时可区分
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1930/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ps2api-redis
    restart: unless-stopped
    # 开启 AOF 持久化，重启不丢会话映射；数据落盘到独立卷。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
