services:
  ps2api:
    build: .
    image: ps2api
    container_name: ps2api
    restart: unless-stopped
    ports:
      - "1930:1930"
    volumes:
      - ./data:/data
    # API Key 不再走环境变量：首次启动后在面板「系统设置 → 安全与认证」设置，存入 SQLite。
    environment:
      # - GATEWAY_PORT=1930
      - GATEWAY_TRACE_LOG=1
      - GATEWAY_TRACE_DIR=/data/traces
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-1}
      - REDIS_KEY_PREFIX=ps2api
      # 面板登录：ADMIN_PASSWORD 不设则关闭登录（保持无密码引导态）。
      # 多副本或希望重启后会话不掉线时，再设一个固定的 GATEWAY_SESSION_SECRET。
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me
      # - GATEWAY_SESSION_SECRET=<openssl rand -hex 32>
      # - REDIS_CONV_TTL=72h      # 会话映射存活时长，0/off/none/never 表示永不过期
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1930/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  # 项目自身的默认网络（保持 ps2api 原有的对外/对内连通性）
  default:
